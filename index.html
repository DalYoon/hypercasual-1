<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>눈밭 밥집 - 방치형 경영 게임</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div id="app">
  <header>
    <h1>❄️ 눈밭 밥집</h1>
    <div id="resources">
      <span class="res">🪙 <b id="res-coins">0</b></span>
      <span class="res">😋 <b id="res-fed">0</b></span>
      <span class="res">👷 <b id="res-workers">1</b></span>
    </div>
  </header>

  <main>
    <section id="field">
      <div id="seats"></div>
      <div id="workers"></div>
      <div id="snow"></div>
    </section>
    <p id="hint">일꾼이 알아서 고기 수집 → 요리 → 서빙까지 해요. 코인으로 업그레이드를 사주세요!</p>

    <section id="upgrades">
      <h2>업그레이드</h2>
      <div id="upgrade-list"></div>
    </section>

    <footer>
      <button id="btn-reset">진행 초기화</button>
      <p class="credit">Assets: Kenney - Pixel Platformer &amp; Food Expansion (CC0, kenney.nl)</p>
    </footer>
  </main>
</div>

<div id="offline-modal" class="hidden">
  <div id="offline-box">
    <h2>🌙 자리를 비운 사이...</h2>
    <p id="offline-text"></p>
    <button id="offline-close">확인</button>
  </div>
</div>

<div id="toast-wrap"></div>
<script src="game.js?v=3"></script>
</body>
</html>
